name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  # Called by publish.yml, so nothing reaches npm without this passing.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No lockfile here: this package ships config and plugins, and its only
      # dependency is the biome the fixtures are proved against.
      - run: pnpm install

      # This package restates @turystack/config rather than extending it: Biome
      # ignores a nested `extends` silently, so a chain through a shared package
      # applies nothing and reports nothing. Restating drifts, so it is compared.
      - name: Baseline agreement
        run: pnpm check:baseline

      # Every GritQL rule ships a pair — one file that must produce its
      # diagnostic, one that must produce none. The pair is what stops a rule
      # from silently catching nothing after the code around it changes, which
      # is the failure mode a rule written from one example always has.
      - name: Rule fixtures
        run: pnpm check:fixtures
        env:
          BIOME: ./node_modules/.bin/biome
